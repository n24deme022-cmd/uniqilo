name: ChatGPT NCKH transfer test
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          echo ok > out/test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-nckh-test
          path: out
          retention-days: 1
